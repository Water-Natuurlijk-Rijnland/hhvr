[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "peilbeheer-hhvr"
version = "2.0.0"
description = "Water level management tools for Hoogheemraadschap van Rijnland"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Copyright © Hoogheemraadschap van Rijnland"}
authors = [
    {name = "Hoogheemraadschap van Rijnland"}
]
dependencies = [
    "requests>=2.25.0",
    "pandas>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=21.0",
    "flake8>=3.9",
]

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-dir]
"" = "."

[tool.black]
line-length = 100
target-version = ['py38']
